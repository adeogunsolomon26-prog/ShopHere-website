<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopHere - Marketplace</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>body{font-family:'Inter',sans-serif}</style>
</head>
<body class="bg-[#f7f7f7]">
<!-- BLUE HEADER LIKE EBAY -->
<header class="bg-[#0064D2] text-white p-4 sticky top-0 z-50">
  <div class="max-w-7xl mx-auto flex justify-between items-center">
    <h1 class="text-3xl font-bold flex items-center gap-2">🛍️ ShopHere</h1>
    <div class="flex gap-4 text-xl">
      <span>💬</span><span>❤️</span><span>🛒</span><span>👤</span>
    </div>
  </div>
</header>

<!-- BIG SEARCH LIKE EBAY -->
<div class="max-w-5xl mx-auto mt-6 px-4">
  <div class="bg-white rounded-full shadow-md flex p-2 border">
    <input id="search" placeholder="Search for anything — phones, fashion, home..." class="flex-1 px-6 py-3 outline-none text-lg rounded-full">
    <button onclick="search()" class="bg-[#0064D2] text-white px-8 py-3 rounded-full font-bold hover:bg-blue-700">Search</button>
  </div>
</div>

<!-- CATEGORIES LIKE OFFERUP -->
<div class="max-w-7xl mx-auto mt-6 px-4 flex gap-3 overflow-x-auto pb-2">
  <button class="bg-[#0064D2] text-white px-5 py-2 rounded-full whitespace-nowrap">All</button>
  <button class="bg-white px-5 py-2 rounded-full shadow whitespace-nowrap">📱 Electronics</button>
  <button class="bg-white px-5 py-2 rounded-full shadow whitespace-nowrap">👕 Fashion</button>
  <button class="bg-white px-5 py-2 rounded-full shadow whitespace-nowrap">🏠 Home</button>
  <button class="bg-white px-5 py-2 rounded-full shadow whitespace-nowrap">🚗 Motors</button>
</div>

<!-- PRODUCTS GRID LIKE OFFERUP -->
<div class="max-w-7xl mx-auto mt-8 px-4">
  <h2 class="text-2xl font-bold mb-4">Trending Now <span class="text-[#0064D2] text-lg ml-2">See all ›</span></h2>
  <div id="products" class="grid grid-cols-2 md:grid-cols-4 gap-4">
    <!-- Products load here from your API -->
  </div>
</div>

<script>
// Load products from your LIVE API
async function loadProducts(){
  try{
    const res = await fetch('/api/products');
    const data = await res.json();
    const container = document.getElementById('products');
    if(data.length === 0){
      // Demo products if DB empty
      container.innerHTML = `
        ${demoCard('$45','iPhone 14 Pro','Lagos, NG','📱')}
        ${demoCard('$72','Nike Air Max','Abuja, NG','👟')}
        ${demoCard('$18','Plant Pot','Lagos, NG','🌿')}
        ${demoCard('$59','Headphones','Port Harcourt, NG','🎧')}
        ${demoCard('$120','Apple Watch','Lagos, NG','⌚')}
        ${demoCard('$250','Sofa Couch','Ibadan, NG','🛋️')}
        ${demoCard('$380','PlayStation 5','Lagos, NG','🎮')}
        ${demoCard('$42','Backpack','Kano, NG','🎒')}
      `;
    } else {
      container.innerHTML = data.map(p => demoCard('$'+p.price, p.name, p.location||'Lagos, NG', '📦')).join('');
    }
  }catch(e){ console.log(e); }
}
function demoCard(price,title,loc,emoji){
  return `<div class="bg-white rounded-2xl shadow hover:shadow-xl transition p-3 cursor-pointer">
    <div class="bg-gray-100 rounded-xl h-40 flex items-center justify-center text-6xl relative">
      ${emoji}
      <span class="absolute top-2 right-2 bg-white rounded-full p-2 shadow">♡</span>
      <span class="absolute bottom-2 left-2 bg-green-600 text-white px-3 py-1 rounded-full text-sm font-bold">${price}</span>
    </div>
    <h3 class="font-semibold mt-3 truncate">${title}</h3>
    <p class="text-gray-500 text-sm">📍 ${loc} • 2h ago</p>
  </div>`;
}
function search(){ alert('Searching: '+document.getElementById('search').value); }
loadProducts();
</script>
</body>
</html>
